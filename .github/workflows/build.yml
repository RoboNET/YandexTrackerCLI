name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # Синтаксис и типовые ошибки workflow'ов. Дёшево и ловит то, что иначе всплывает только
  # в момент релиза: prepare-release запускается вручную и редко, ошибка в нём обнаружилась
  # бы ровно тогда, когда её меньше всего хочется видеть.
  #
  # Условия на job здесь намеренно нет — в том числе на push тега. Пропуск job'а GitHub
  # распространяет по всей цепочке needs, а не только на прямых потомков: пропущенный линт
  # утаскивал бы за собой publish и release, и релиз по тегу выходил бы пустым (так сорвался
  # v0.6.0). Отдельного риска «красный линт заблокирует релиз» этот job не создаёт: тег
  # ставит prepare-release, который до простановки требует зелёного build.yml на вершине
  # main, а линт там уже отработал на том же коде.
  workflows-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint (pinned + checksum)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" actionlint

      - name: Lint workflows
        run: ./actionlint -color

  test:
    # Гейт, а не соседний job: иначе матрица тестов, публикация и релиз спокойно едут при
    # красном actionlint. Условия на job нет сознательно — работает подразумеваемый success(),
    # то есть тесты идут ровно тогда, когда линт зелёный.
    needs: [workflows-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore YandexTrackerCLI.slnx

      - name: Build (Release)
        run: dotnet build YandexTrackerCLI.slnx --configuration Release --no-restore

      - name: Test (Core)
        run: dotnet test --project tests/YandexTrackerCLI.Core.Tests/YandexTrackerCLI.Core.Tests.csproj --configuration Release --no-build

      - name: Test (CLI)
        run: dotnet test --project tests/YandexTrackerCLI.Tests/YandexTrackerCLI.Tests.csproj --configuration Release --no-build

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     rid: linux-x64,        archive: tar.gz }
          - { os: ubuntu-24.04-arm,  rid: linux-arm64,      archive: tar.gz }
          - { os: ubuntu-latest,     rid: linux-musl-x64,   archive: tar.gz, musl: true }
          - { os: ubuntu-24.04-arm,  rid: linux-musl-arm64, archive: tar.gz, musl: true }
          - { os: macos-latest,      rid: osx-arm64,        archive: tar.gz }
          - { os: windows-latest,    rid: win-x64,          archive: zip    }
    runs-on: ${{ matrix.os }}
    env:
      # Образ для musl-сборок. Тег плавающий по патчам намеренно: global.json требует SDK
      # не ниже 10.0.201 при rollForward=latestFeature, и плавающий тег гарантирует это без
      # ручного обновления. Воспроизводимость сборки здесь не пострадает: версия бинаря
      # берётся из git-тега (MinVer), а не из окружения.
      MUSL_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-alpine
      # Голый Alpine для проверки запуска: важно, что бинарь стартует БЕЗ SDK и без gcompat.
      MUSL_RUNTIME_IMAGE: alpine:3.22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        if: ${{ !matrix.musl }}
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish (NativeAOT)
        if: ${{ !matrix.musl }}
        run: dotnet publish src/YandexTrackerCLI/YandexTrackerCLI.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}

      # NativeAOT линкует нативным тулчейном целевой платформы, поэтому musl-бинарь собирается
      # внутри Alpine-контейнера (нативно для musl), а не кросс-компиляцией с glibc-раннера.
      # Контейнер поднимается через docker run, а не через `container:` на job: официальные
      # actions выполняются node'ой, которую раннер монтирует внутрь контейнера, и в Alpine
      # это отдельная морока — здесь она не нужна, checkout и упаковка идут на хосте.
      - name: Publish (NativeAOT, musl in Alpine)
        if: ${{ matrix.musl }}
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e RID="${{ matrix.rid }}" \
            "$MUSL_SDK_IMAGE" \
            sh -euc '
              apk add --no-cache clang build-base zlib-dev git
              git config --global --add safe.directory /src
              dotnet publish src/YandexTrackerCLI/YandexTrackerCLI.csproj \
                -c Release -r "$RID" --self-contained -o "publish/$RID"
            '

      - name: Read version
        if: ${{ !matrix.musl }}
        id: version
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            VERSION=$(./publish/${{ matrix.rid }}/yt.exe --version)
          else
            VERSION=$(./publish/${{ matrix.rid }}/yt --version)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # Запуск в голом Alpine, без SDK и без gcompat — ровно тот сценарий, ради которого
      # musl-артефакты и появились (issue #27). На glibc-раннере этот бинарь не стартует,
      # поэтому проверять его шагом выше нельзя.
      - name: Read version (musl in Alpine)
        if: ${{ matrix.musl }}
        id: version-musl
        run: |
          VERSION=$(docker run --rm -v "$PWD":/src -w /src "$MUSL_RUNTIME_IMAGE" \
            ./publish/${{ matrix.rid }}/yt --version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf "../../yt-${{ matrix.rid }}.tar.gz" yt
          cd ../..
          ls -la yt-${{ matrix.rid }}.tar.gz

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.rid }}/yt.exe" -DestinationPath "yt-${{ matrix.rid }}.zip"
          Get-Item yt-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-${{ matrix.rid }}
          path: yt-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          ls -la
          sha256sum yt-*.tar.gz yt-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/yt-*.tar.gz
            artifacts/yt-*.zip
            artifacts/SHA256SUMS
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Release создан через GITHUB_TOKEN — следствие: release event НЕ триггерит
      # chained workflows (anti-recursion правило GitHub Actions). Поэтому явно
      # дёргаем bucket workflows через workflow_dispatch с PAT.
      - name: Dispatch bucket workflows
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh workflow run "Update Homebrew tap" \
            --repo ${{ github.repository }} \
            --ref main \
            --field version="$VERSION"
          gh workflow run "Update Scoop bucket" \
            --repo ${{ github.repository }} \
            --ref main \
            --field version="$VERSION"

  # Версия в .claude-plugin/plugin.json и в маркере yt-version в SKILL.md проставляется
  # ДО тега — workflow prepare-release.yml. Прежний job sync-plugin-version делал это
  # ПОСЛЕ релиза, из-за чего тег всегда нёс версию предыдущего релиза (issue #20).
